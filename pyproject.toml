[project]
name = "crap4sol"
version = "0.1.0"
description = "CRAP quality gate for Foundry Solidity projects"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["slither-analyzer"]

[project.scripts]
crap4sol = "crap4sol.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crap4sol"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "slither: needs Slither and solc",
    "e2e: needs forge and Slither",
]
